[project]
name = "ards-cxr-mimic-benchmark"
version = "0.3.0"
description = "MIMIC-CXR bilateral opacity report-NLP silver benchmark pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Brian Locke", email = "43303875+reblocke@users.noreply.github.com"},
]
dependencies = [
  "db-dtypes>=1.2",
  "google-cloud-bigquery>=3.20",
  "google-cloud-storage>=2.16",
  "joblib>=1.4",
  "matplotlib>=3.11.0",
  "pandas>=2.2",
  "pingouin>=0.5.5",
  "pyarrow>=15",
  "pyyaml>=6.0",
  "regex>=2024.5.15",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "tqdm>=4.66",
]

[dependency-groups]
dev = [
  "hypothesis>=6.156.6",
  "ipykernel>=7.3.0",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.2",
  "ruff>=0.15.1",
]
hooks = [
  "pre-commit>=3.7",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-q"]
testpaths = ["tests"]
markers = [
  "external_model: requires pinned external model artifacts and an isolated runtime",
  "licensed_clamp: requires ARDS_CLAMP_PROJECT_DIR with separately licensed CLAMP resources",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ards_cxr_benchmark"]


[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ards_cxr_benchmark.clamp_ards" = ["data/*.json"]
