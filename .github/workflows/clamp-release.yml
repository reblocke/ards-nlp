name: CLAMP Release Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARDS_CLAMP_PROJECT_DIR: tests/fixtures/clamp_ards_external_resources
  ARDS_CLAMP_RESOURCE_MANIFEST: tests/fixtures/clamp_ards_external_resources/manifest.json

jobs:
  fixture-status:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          prune-cache: true

      - name: Install verification dependencies
        run: uv sync --locked --no-default-groups --group dev

      - name: Validate public pending fixture
        run: |
          make clamp-ards-parity-fixture-prepare
          make clamp-ards-parity-fixture-validate
          {
            echo "## CLAMP public fixture maturity"
            echo
            echo "Status: pending."
            echo
            echo "The deterministic synthetic input matrix is valid. Genuine CLAMP outputs,"
            echo "named PHI review, and two-run determinism evidence are not yet public."
          } >> "$GITHUB_STEP_SUMMARY"

  resource-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          prune-cache: true

      - name: Install verification dependencies
        run: uv sync --locked --no-default-groups --group dev

      - name: Public CLAMP resource audit
        run: make clamp-ards-resources-public-audit

      - name: Repository release audit
        run: make release-audit
