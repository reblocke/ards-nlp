name: Annotation Reports

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/annotation-reports.yml"
      - "config/annotation_*.example.yaml"
      - "notebooks/*annotation*.qmd"
      - "notebooks/01_redcap_pilot_agreement.qmd"
      - "scripts/render_annotation_*.py"
      - "scripts/validate_annotation_smoke_reports.py"
      - "src/ards_cxr_benchmark/annotation_*.py"
      - "src/ards_cxr_benchmark/pilot_annotation_*.py"
      - "tests/fixtures/redcap_annotation/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/annotation-reports.yml"
      - "config/annotation_*.example.yaml"
      - "notebooks/*annotation*.qmd"
      - "notebooks/01_redcap_pilot_agreement.qmd"
      - "scripts/render_annotation_*.py"
      - "scripts/validate_annotation_smoke_reports.py"
      - "src/ards_cxr_benchmark/annotation_*.py"
      - "src/ards_cxr_benchmark/pilot_annotation_*.py"
      - "tests/fixtures/redcap_annotation/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  render-and-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.8.26"

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group dev

      - name: Render synthetic annotation reports
        run: make annotation-planning-smoke

      - name: Audit rendered reports
        run: uv run python scripts/validate_annotation_smoke_reports.py
