name: Annotation Reports

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/annotation-reports.yml"
      - "config/annotation_*.example.yaml"
      - "notebooks/*annotation*.qmd"
      - "notebooks/01_redcap_pilot_agreement.qmd"
      - "scripts/render_annotation_*.py"
      - "scripts/validate_annotation_smoke_reports.py"
      - "src/ards_cxr_benchmark/annotation_*.py"
      - "src/ards_cxr_benchmark/pilot_annotation_*.py"
      - "tests/fixtures/redcap_annotation/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/annotation-reports.yml"
      - "config/annotation_*.example.yaml"
      - "notebooks/*annotation*.qmd"
      - "notebooks/01_redcap_pilot_agreement.qmd"
      - "scripts/render_annotation_*.py"
      - "scripts/validate_annotation_smoke_reports.py"
      - "src/ards_cxr_benchmark/annotation_*.py"
      - "src/ards_cxr_benchmark/pilot_annotation_*.py"
      - "tests/fixtures/redcap_annotation/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  render-and-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.8.26"

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group dev

      - name: Render synthetic annotation reports
        run: make annotation-planning-smoke

      - name: Audit rendered reports
        run: uv run python scripts/validate_annotation_smoke_reports.py
