name: uw-hanso-ards
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.8
  - pip=20.2.4
  - setuptools=50.3.2
  - wheel=0.36.2
  - pip:
      - torch==1.6.0
      - allennlp==1.3.0
      # The upstream inference graph imports AllenNLP core only. Its pinned
      # allennlp-models package requires torch>=1.7 and conflicts with torch 1.6.
      - transformers==4.0.1
      - spacy==2.3.2
      - blis==0.4.1
      - catalogue==1.0.0
      - cymem==2.0.5
      - murmurhash==1.0.5
      - plac==1.1.3
      - preshed==3.0.5
      - srsly==1.0.5
      - thinc==7.4.1
      - wasabi==0.8.0
      - scipy==1.5.4
      - scikit-learn==0.24.0
      - matplotlib==3.3.3
      - seaborn==0.11.1
      - tensorboardX==2.1
      - protobuf==3.14.0
      - medspacy==0.1.0.0
      - Cython==0.29.21
      - PyFastNER==1.0.8b9
      - PyRuSH==1.0.3.5
      - pylcs==0.0.6
      - quicksectx==0.3.0
      - pandas==1.1.5
      - numpy==1.19.4
      - joblib==1.0.0
      - nltk==3.5
      - tqdm==4.54.1
      - https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-2.3.1/en_core_web_sm-2.3.1.tar.gz
